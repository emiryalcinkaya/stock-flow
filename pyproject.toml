[project]
name = "eysto"
version = "1.0.0"
description = "Inventory and sales management system built with FastAPI and PostgreSQL."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI uses Depends(...) in default arguments

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
