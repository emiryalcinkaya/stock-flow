name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockflow_user
          POSTGRES_PASSWORD: stockflow_password
          POSTGRES_DB: stockflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://stockflow_user:stockflow_password@localhost:5432/stockflow_test
      database_url: postgresql+psycopg2://stockflow_user:stockflow_password@localhost:5432/stockflow_test
      secret_key: ci-secret-key-that-is-long-enough

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Tests
        run: pytest
