<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eysto Stock Out History</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2" />
  <script>try{if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed")}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/main.css?v=10" />
  <link rel="stylesheet" href="assets/css/sales.css?v=5" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/images/logo.svg" alt="Eysto logo" class="brand-logo" />
        <div>
          <div class="brand-title">Eysto</div>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-link" href="dashboard.html">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </a>

        <a class="nav-link" href="products.html">
          <i data-lucide="package"></i>
          <span>Products</span>
        </a>

        <a class="nav-link" href="sales.html">
          <i data-lucide="package-minus"></i>
          <span>Stock Out</span>
        </a>

        <a class="nav-link active" href="sales-history.html">
          <i data-lucide="history"></i>
          <span>Stock Out History</span>
        </a>

        <a class="nav-link" href="settings.html" data-role="admin">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user" data-current-user hidden>
          <div class="sidebar-user-name" data-user-name></div>
          <div class="sidebar-user-role" data-user-role></div>
        </div>
        <button class="btn btn-secondary logout-btn" data-logout>
          <i data-lucide="log-out"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="content">
      <div class="topbar">
        <div>
          <h1 class="page-title">Stock Out History</h1>
          <p class="page-subtitle">Review everything that left stock and inspect the details.</p>
        </div>
      </div>

      <section class="grid grid-2">
        <div class="card">
          <div class="card-header">
            <h3>All Stock Outs</h3>
          </div>
          <div class="card-body">
            <form id="salesFilterForm" class="sales-filter">
              <div class="field">
                <label for="dateFrom">From</label>
                <input id="dateFrom" class="input" type="date" />
              </div>
              <div class="field">
                <label for="dateTo">To</label>
                <input id="dateTo" class="input" type="date" />
              </div>
              <div class="field">
                <label for="reasonFilter">Reason</label>
                <div class="select-shell">
                  <select id="reasonFilter" class="select"></select>
                </div>
              </div>
              <div class="sales-filter-actions">
                <button class="btn btn-primary" type="submit">Filter</button>
                <button class="btn btn-secondary" type="reset">Clear</button>
              </div>
            </form>

            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Reason</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="salesHistoryTable"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3>Details</h3>
          </div>
          <div class="card-body" id="saleDetailPanel">
            <div class="empty-state">Select a record to see the details.</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="assets/js/sales-history.js?v=5"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
