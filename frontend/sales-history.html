<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eysto</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2" />
  <script>try{if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed")}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/main.css?v=7" />
  <link rel="stylesheet" href="assets/css/sales.css?v=7" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body data-page="stock-out-history" data-title-key="nav.stockOutHistory">
  <div class="page-shell">
    <aside class="sidebar"></aside>

    <main class="content">
      <div class="topbar">
        <div>
          <h1 class="page-title" data-i18n="nav.stockOutHistory"></h1>
          <p class="page-subtitle" data-i18n="history.pageSubtitle"></p>
        </div>
        <div class="topbar-actions">
          <button id="exportButton" class="btn btn-secondary icon-btn" type="button">
            <i data-lucide="download"></i>
            <span data-i18n="common.exportCsv"></span>
          </button>
        </div>
      </div>

      <section class="grid grid-2">
        <div class="card">
          <div class="card-header">
            <h3 data-i18n="history.allStockOuts"></h3>
          </div>
          <div class="card-body">
            <form id="salesFilterForm" class="sales-filter">
              <div class="field">
                <label for="dateFrom" data-i18n="field.from"></label>
                <input id="dateFrom" class="input" type="date" />
              </div>
              <div class="field">
                <label for="dateTo" data-i18n="field.to"></label>
                <input id="dateTo" class="input" type="date" />
              </div>
              <div class="field">
                <label for="reasonFilter" data-i18n="field.reason"></label>
                <div class="select-shell">
                  <select id="reasonFilter" class="select"></select>
                </div>
              </div>
              <div class="sales-filter-actions">
                <button class="btn btn-primary" type="submit" data-i18n="common.filter"></button>
                <button class="btn btn-secondary" type="reset" data-i18n="common.clear"></button>
              </div>
            </form>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th data-i18n="col.id"></th>
                    <th data-i18n="col.reason"></th>
                    <th data-i18n="col.total"></th>
                    <th data-i18n="col.status"></th>
                    <th data-i18n="col.date"></th>
                    <th data-i18n="col.actions"></th>
                  </tr>
                </thead>
                <tbody id="salesHistoryTable"></tbody>
              </table>
            </div>
            <div id="salesPager"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 data-i18n="history.details"></h3>
          </div>
          <div class="card-body" id="saleDetailPanel">
            <div class="empty-state" data-i18n="history.selectRecord"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="assets/js/sales-history.js?v=7"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
