<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eysto</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2" />
  <link rel="stylesheet" href="assets/css/main.css?v=7" />
  <link rel="stylesheet" href="assets/css/auth.css?v=7" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body data-title-key="login.title">
  <div class="select-shell auth-language">
    <select id="languageSelect" class="select" data-i18n-aria-label="common.language"></select>
  </div>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-header">
        <img src="assets/images/logo.svg" alt="" class="auth-brand-logo" />
        <h1 class="auth-title">Eysto</h1>
        <p class="auth-subtitle" data-i18n="login.subtitle"></p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="username" data-i18n="login.username"></label>
          <input class="input" type="text" id="username" data-i18n-placeholder="login.usernamePlaceholder" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password" data-i18n="login.password"></label>
          <input class="input" type="password" id="password" data-i18n-placeholder="login.passwordPlaceholder" autocomplete="current-password" required />
        </div>

        <button id="loginButton" class="btn btn-primary" type="submit">
          <i data-lucide="log-in"></i>
          <span data-i18n="login.signIn"></span>
        </button>
        <p id="message" class="form-message"></p>
      </form>

      <div class="auth-footer">
        <span data-i18n="login.demoAccounts"></span>
        <strong>admin / admin123</strong> · <strong>cashier / cashier123</strong>
      </div>
    </section>
  </main>

  <script type="module">
    import { initLoginPage } from "./assets/js/auth.js?v=7";
    initLoginPage();
  </script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
