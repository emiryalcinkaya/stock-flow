<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eysto</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2" />
  <script>try{if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed")}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/main.css?v=7" />
  <link rel="stylesheet" href="assets/css/products.css?v=7" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body data-page="settings" data-title-key="nav.settings">
  <div class="page-shell">
    <aside class="sidebar"></aside>

    <main class="content">
      <div class="topbar">
        <div>
          <h1 class="page-title" data-i18n="nav.settings"></h1>
          <p class="page-subtitle" data-i18n="settings.subtitle"></p>
        </div>
      </div>

      <section class="card">
        <div class="card-header">
          <h3 data-i18n="common.language"></h3>
        </div>
        <div class="card-body">
          <div class="form-grid">
            <div class="field">
              <label for="languageSelect" data-i18n="common.language"></label>
              <div class="select-shell">
                <select id="languageSelect" class="select"></select>
              </div>
            </div>
          </div>
          <p class="metric-note section-spacing" data-i18n="account.languageHint"></p>
        </div>
      </section>

      <section class="card section-spacing">
        <div class="card-header">
          <h3 data-i18n="settings.business"></h3>
        </div>
        <div class="card-body">
          <form id="companyForm" class="company-form">
            <div class="company-logo-field">
              <img id="companyLogoPreview" class="company-logo-preview" src="assets/images/logo.svg" alt="" />
              <div class="company-logo-actions">
                <label class="btn btn-secondary icon-btn" for="companyLogoInput">
                  <i data-lucide="upload"></i>
                  <span data-i18n="settings.uploadLogo"></span>
                </label>
                <input id="companyLogoInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden />
                <button id="removeLogoButton" class="btn btn-secondary icon-btn" type="button">
                  <i data-lucide="trash-2"></i>
                  <span data-i18n="action.remove"></span>
                </button>
                <p class="metric-note" data-i18n="settings.logoHint"></p>
              </div>
            </div>

            <div class="form-grid">
              <div class="field">
                <label for="companyName" data-i18n="settings.businessName"></label>
                <input id="companyName" class="input" type="text" maxlength="100" placeholder="Eysto" />
              </div>
              <div class="field">
                <label for="companyCurrency" data-i18n="settings.currency"></label>
                <div class="select-shell">
                  <select id="companyCurrency" class="select">
                    <option value="TRY">₺ Türk lirası (TRY)</option>
                    <option value="USD">$ US dollar (USD)</option>
                    <option value="EUR">€ Euro (EUR)</option>
                  </select>
                </div>
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <label for="companyDescription" data-i18n="settings.description"></label>
                <input id="companyDescription" class="input" type="text" maxlength="300" data-i18n-placeholder="dashboard.tagline" />
              </div>
            </div>

            <div>
              <button id="saveCompanyButton" class="btn btn-primary icon-btn" type="submit">
                <i data-lucide="check"></i>
                <span data-i18n="common.save"></span>
              </button>
            </div>
          </form>
        </div>
      </section>

      <section class="grid grid-2 section-spacing">
        <div class="card">
          <div class="card-header">
            <h3 data-i18n="settings.categories"></h3>
          </div>
          <div class="card-body">
            <form id="categoryForm" class="inline-form">
              <input id="categoryName" class="input" type="text" maxlength="100" data-i18n-placeholder="settings.newCategory" required />
              <button class="btn btn-primary icon-btn" type="submit">
                <i data-lucide="plus"></i>
                <span data-i18n="common.add"></span>
              </button>
            </form>

            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th data-i18n="col.name"></th>
                    <th data-i18n="nav.products"></th>
                    <th data-i18n="col.actions"></th>
                  </tr>
                </thead>
                <tbody id="categoriesTable"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 data-i18n="settings.warehouses"></h3>
          </div>
          <div class="card-body">
            <form id="warehouseForm" class="inline-form">
              <input id="warehouseName" class="input" type="text" maxlength="100" data-i18n-placeholder="settings.newWarehouse" required />
              <button class="btn btn-primary icon-btn" type="submit">
                <i data-lucide="plus"></i>
                <span data-i18n="common.add"></span>
              </button>
            </form>

            <p class="metric-note settings-hint" data-i18n="settings.warehouseHint"></p>

            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th data-i18n="col.name"></th>
                    <th data-i18n="nav.products"></th>
                    <th data-i18n="col.status"></th>
                    <th data-i18n="col.actions"></th>
                  </tr>
                </thead>
                <tbody id="warehousesTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <section class="card section-spacing">
        <div class="card-header">
          <h3 data-i18n="settings.suppliers"></h3>
        </div>
        <div class="card-body">
          <form id="supplierForm" class="form-grid supplier-form">
            <div class="field">
              <label for="supplierName" data-i18n="col.name"></label>
              <input id="supplierName" class="input" type="text" maxlength="150" required />
            </div>
            <div class="field">
              <label for="supplierContact" data-i18n="settings.contactPerson"></label>
              <input id="supplierContact" class="input" type="text" maxlength="100" />
            </div>
            <div class="field">
              <label for="supplierPhone" data-i18n="settings.phone"></label>
              <input id="supplierPhone" class="input" type="tel" maxlength="50" />
            </div>
            <div class="field">
              <label for="supplierEmail" data-i18n="field.email"></label>
              <input id="supplierEmail" class="input" type="email" maxlength="150" />
            </div>
            <div style="grid-column: 1 / -1;">
              <button id="addSupplierButton" class="btn btn-primary icon-btn" type="submit">
                <i data-lucide="plus"></i>
                <span data-i18n="settings.addSupplier"></span>
              </button>
            </div>
          </form>

          <div class="table-wrap section-spacing">
            <table class="table">
              <thead>
                <tr>
                  <th data-i18n="col.name"></th>
                  <th data-i18n="settings.contactPerson"></th>
                  <th data-i18n="settings.phone"></th>
                  <th data-i18n="field.email"></th>
                  <th data-i18n="col.status"></th>
                  <th data-i18n="col.actions"></th>
                </tr>
              </thead>
              <tbody id="suppliersTable"></tbody>
            </table>
          </div>
        </div>
      </section>
      <section class="card section-spacing" id="users">
        <div class="card-header">
          <h3 data-i18n="users.addTitle"></h3>
        </div>
        <div class="card-body">
          <form id="userForm" class="form-grid">
            <div class="field">
              <label for="fullName" data-i18n="field.fullName"></label>
              <input id="fullName" class="input" type="text" maxlength="100" required />
            </div>
            <div class="field">
              <label for="username" data-i18n="login.username"></label>
              <input id="username" class="input" type="text" minlength="3" maxlength="50" pattern="[A-Za-z0-9_.\-]+" autocomplete="off" required />
            </div>
            <div class="field">
              <label for="email" data-i18n="field.email"></label>
              <input id="email" class="input" type="email" maxlength="150" required />
            </div>
            <div class="field">
              <label for="role" data-i18n="field.role"></label>
              <div class="select-shell">
                <select id="role" class="select">
                  <option value="cashier" data-i18n="role.cashier"></option>
                  <option value="admin" data-i18n="role.admin"></option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="password"><span data-i18n="login.password"></span> <span class="field-hint" data-i18n="users.passwordHint"></span></label>
              <input id="password" class="input" type="password" minlength="8" maxlength="128" autocomplete="new-password" required />
            </div>
            <div style="grid-column: 1 / -1;">
              <button id="addUserButton" class="btn btn-primary icon-btn" type="submit">
                <i data-lucide="user-plus"></i>
                <span data-i18n="users.add"></span>
              </button>
            </div>
          </form>
        </div>
      </section>

      <section class="card section-spacing">
        <div class="card-header">
          <h3 data-i18n="users.listTitle"></h3>
        </div>
        <div class="card-body">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th data-i18n="field.fullName"></th>
                  <th data-i18n="login.username"></th>
                  <th data-i18n="field.email"></th>
                  <th data-i18n="field.role"></th>
                  <th data-i18n="col.status"></th>
                  <th data-i18n="col.actions"></th>
                </tr>
              </thead>
              <tbody id="usersTable"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="editUserOverlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-head-group">
          <div class="icon-chip">
            <i data-lucide="user-cog"></i>
          </div>
          <div>
            <div class="modal-title" data-i18n="users.editTitle"></div>
            <div id="editUserSubtitle" class="modal-subtitle"></div>
          </div>
        </div>
        <button class="modal-close" type="button" data-close-modal data-i18n-aria-label="common.close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="product-modal-grid">
          <div class="field">
            <label for="editFullName" data-i18n="field.fullName"></label>
            <input id="editFullName" class="input" type="text" maxlength="100" />
          </div>
          <div class="field">
            <label for="editEmail" data-i18n="field.email"></label>
            <input id="editEmail" class="input" type="email" maxlength="150" />
          </div>
          <div class="field">
            <label for="editRole" data-i18n="field.role"></label>
            <div class="select-shell">
              <select id="editRole" class="select">
                <option value="cashier" data-i18n="role.cashier"></option>
                <option value="admin" data-i18n="role.admin"></option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="editNewPassword"><span data-i18n="users.newPassword"></span> <span class="field-hint" data-i18n="users.newPasswordHint"></span></label>
            <input id="editNewPassword" class="input" type="password" minlength="8" maxlength="128" autocomplete="new-password" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" type="button" data-close-modal data-i18n="common.cancel"></button>
        <button class="btn btn-primary" id="saveUserButton" data-i18n="common.save"></button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/settings.js?v=8"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
