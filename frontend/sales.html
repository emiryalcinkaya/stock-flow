<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eysto</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2" />
  <script>try{if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed")}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/main.css?v=9" />
  <link rel="stylesheet" href="assets/css/sales.css?v=9" />
  <link rel="stylesheet" href="assets/css/mobile.css?v=9" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body data-page="stock-out" data-title-key="nav.stockOut">
  <div class="page-shell">
    <aside class="sidebar"></aside>

    <main class="content">
      <div class="topbar">
        <div>
          <h1 class="page-title" data-i18n="nav.stockOut"></h1>
          <p class="page-subtitle" data-i18n="stockOut.subtitle"></p>
        </div>
      </div>

      <section class="card">
        <div class="card-header">
          <h3 data-i18n="stockOut.details"></h3>
        </div>
        <div class="card-body">
          <div class="form-grid">
            <div class="field">
              <label for="reasonSelect" data-i18n="field.reason"></label>
              <div class="select-shell">
                <select id="reasonSelect" class="select"></select>
              </div>
            </div>

            <div class="field" data-multi-warehouse hidden>
              <label for="warehouseSelect" data-i18n="field.warehouse"></label>
              <div class="select-shell">
                <select id="warehouseSelect" class="select"></select>
              </div>
            </div>

            <div class="field" style="grid-column: 1 / -1;">
              <label for="noteInput"><span data-i18n="field.note"></span> <span class="field-hint" data-i18n="stockOut.noteHint"></span></label>
              <input id="noteInput" class="input" type="text" maxlength="500" />
            </div>
          </div>
        </div>
      </section>

      <section class="card section-spacing">
        <div class="card-header">
          <h3 data-i18n="stockOut.addItem"></h3>
        </div>
        <div class="card-body">
          <div class="product-picker">
            <div class="field">
              <label for="productSelect" data-i18n="field.product"></label>
              <div class="select-shell">
                <select id="productSelect" class="select"></select>
              </div>
            </div>

            <div class="field">
              <label id="saleQtyLabel" for="saleQtyValue" data-i18n="field.quantity"></label>
              <div class="quantity-stepper" role="group" aria-labelledby="saleQtyLabel">
                <button class="stepper-btn" id="decreaseQtyBtn" type="button" data-i18n-aria-label="stockOut.decrease">
                  <i data-lucide="minus"></i>
                </button>
                <input class="stepper-value stepper-input" id="saleQtyValue" type="number" min="0" step="1" value="1" />
                <button class="stepper-btn" id="increaseQtyBtn" type="button" data-i18n-aria-label="stockOut.increase">
                  <i data-lucide="plus"></i>
                </button>
              </div>
            </div>

            <div>
              <button id="addToCartButton" class="btn btn-primary icon-btn" type="button">
                <i data-lucide="plus"></i>
                <span data-i18n="stockOut.addItemButton"></span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <div class="sales-side-grid section-spacing">
        <section class="card">
          <div class="card-header">
            <h3 data-i18n="stockOut.items"></h3>
          </div>
          <div class="card-body">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th data-i18n="col.product"></th>
                    <th data-i18n="col.quantity"></th>
                    <th data-i18n="col.unitPrice"></th>
                    <th data-i18n="col.total"></th>
                    <th data-i18n="col.actions"></th>
                  </tr>
                </thead>
                <tbody id="cartTable"></tbody>
              </table>
            </div>

            <div class="cart-empty-zone"></div>

            <div class="sales-summary section-spacing">
              <div class="sales-meta" data-i18n="stockOut.totalValue"></div>
              <div id="cartTotal" class="sales-total"></div>
              <div>
                <button id="submitSaleButton" class="btn btn-primary icon-btn" type="button">
                  <i data-lucide="check"></i>
                  <span data-i18n="stockOut.record"></span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <section class="card available-products-card">
          <div class="card-header">
            <h3 data-i18n="stockOut.available"></h3>
          </div>
          <div class="card-body">
            <div id="availableProductsList" class="soft-list"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/sales.js?v=9"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
