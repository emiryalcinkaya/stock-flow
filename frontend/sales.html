<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eysto Stock Out</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/sales.css" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/images/logo.svg" alt="Eysto logo" class="brand-logo" />
        <div>
          <div class="brand-title">Eysto</div>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-link" href="dashboard.html">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </a>

        <a class="nav-link" href="products.html">
          <i data-lucide="package"></i>
          <span>Products</span>
        </a>

        <a class="nav-link active" href="sales.html">
          <i data-lucide="package-minus"></i>
          <span>Stock Out</span>
        </a>

        <a class="nav-link" href="sales-history.html">
          <i data-lucide="history"></i>
          <span>Stock Out History</span>
        </a>

        <a class="nav-link" href="settings.html" data-role="admin">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user" data-current-user hidden>
          <div class="sidebar-user-name" data-user-name></div>
          <div class="sidebar-user-role" data-user-role></div>
        </div>
        <button class="btn btn-secondary logout-btn" data-logout>
          <i data-lucide="log-out"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="content">
      <div class="topbar">
        <div>
          <h1 class="page-title">Stock Out</h1>
          <p class="page-subtitle">Record items leaving stock: sales, internal use, waste or returns.</p>
        </div>
      </div>

      <section class="card">
        <div class="card-header">
          <h3>Details</h3>
        </div>
        <div class="card-body">
          <div class="form-grid">
            <div class="field">
              <label for="reasonSelect">Reason</label>
              <div class="select-shell">
                <select id="reasonSelect" class="select"></select>
              </div>
            </div>

            <div class="field" data-multi-warehouse hidden>
              <label for="warehouseSelect">Warehouse</label>
              <div class="select-shell">
                <select id="warehouseSelect" class="select"></select>
              </div>
            </div>

            <div class="field" style="grid-column: 1 / -1;">
              <label for="noteInput">Note <span class="field-hint">(customer, document no, reason...)</span></label>
              <input id="noteInput" class="input" type="text" maxlength="500" />
            </div>
          </div>
        </div>
      </section>

      <section class="card section-spacing">
        <div class="card-header">
          <h3>Add Item</h3>
        </div>
        <div class="card-body">
          <div class="product-picker">
            <div class="field">
              <label for="productSelect">Product</label>
              <div class="select-shell">
                <select id="productSelect" class="select"></select>
              </div>
            </div>

            <div class="field">
              <label id="saleQtyLabel" for="saleQtyValue">Quantity</label>
              <div class="quantity-stepper" role="group" aria-labelledby="saleQtyLabel">
                <button class="stepper-btn" id="decreaseQtyBtn" type="button" aria-label="Decrease quantity">
                  <i data-lucide="minus"></i>
                </button>
                <input class="stepper-value stepper-input" id="saleQtyValue" type="number" min="0" step="1" value="1" />
                <button class="stepper-btn" id="increaseQtyBtn" type="button" aria-label="Increase quantity">
                  <i data-lucide="plus"></i>
                </button>
              </div>
            </div>

            <div>
              <button id="addToCartButton" class="btn btn-primary icon-btn" type="button">
                <i data-lucide="plus"></i>
                <span>Add Item</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <div class="sales-side-grid section-spacing">
        <section class="card">
          <div class="card-header">
            <h3>Items</h3>
          </div>
          <div class="card-body">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Unit Price</th>
                    <th>Total</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="cartTable"></tbody>
              </table>
            </div>

            <div class="cart-empty-zone"></div>

            <div class="sales-summary section-spacing">
              <div class="sales-meta">Total value</div>
              <div id="cartTotal" class="sales-total">$0.00</div>
              <div>
                <button id="submitSaleButton" class="btn btn-primary icon-btn" type="button">
                  <i data-lucide="check"></i>
                  <span>Record Stock Out</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <section class="card available-products-card">
          <div class="card-header">
            <h3>Available Products</h3>
          </div>
          <div class="card-body">
            <div id="availableProductsList" class="soft-list"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/sales.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
