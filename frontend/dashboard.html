<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eysto</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2" />
  <script>try{if(localStorage.getItem("sidebarCollapsed")==="1")document.documentElement.classList.add("sidebar-collapsed")}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/main.css?v=6" />
  <link rel="stylesheet" href="assets/css/dashboard.css?v=6" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body data-page="dashboard" data-title-key="nav.dashboard">
  <div class="page-shell">
    <aside class="sidebar"></aside>

    <main class="content">
      <div class="topbar">
        <div>
          <h1 class="page-title" data-i18n="nav.dashboard"></h1>
          <p class="page-subtitle" data-i18n="dashboard.subtitle"></p>
        </div>
      </div>

      <section class="card hero-card dashboard-hero">
        <div>
          <div class="hero-brand">
            <img id="companyLogo" src="assets/images/logo.svg" alt="" class="hero-brand-logo" />
            <div class="hero-brand-copy">
              <h2 id="companyName" class="hero-brand-title">Eysto</h2>
              <p id="companyDescription" class="hero-brand-tagline" data-i18n="dashboard.tagline"></p>
            </div>
          </div>
        </div>

        <div class="action-inline">
          <a class="btn btn-primary" href="products.html">
            <i data-lucide="package"></i>
            <span data-i18n="nav.products"></span>
          </a>

          <a class="btn btn-primary" href="sales.html">
            <i data-lucide="package-minus"></i>
            <span data-i18n="nav.stockOut"></span>
          </a>
        </div>
      </section>

      <section class="grid grid-4 dashboard-grid">
        <div class="card stat-card">
          <i class="kpi-icon" data-lucide="package-search"></i>
          <div class="stat-label" data-i18n="dashboard.totalProducts"></div>
          <div class="stat-value" id="totalProducts">-</div>
          <div class="metric-note" data-i18n="dashboard.totalProductsNote"></div>
        </div>

        <div class="card stat-card">
          <i class="kpi-icon" data-lucide="shield-alert"></i>
          <div class="stat-label" data-i18n="dashboard.lowStock"></div>
          <div class="stat-value" id="lowStockCount">-</div>
          <div class="metric-note" id="lowStockNote"></div>
        </div>

        <div class="card stat-card">
          <i class="kpi-icon" data-lucide="boxes"></i>
          <div class="stat-label" data-i18n="dashboard.stockValue"></div>
          <div class="stat-value" id="stockValue">-</div>
          <div class="metric-note" data-i18n="dashboard.stockValueNote"></div>
        </div>

        <div class="card stat-card">
          <i class="kpi-icon" data-lucide="wallet"></i>
          <div class="stat-label" data-i18n="dashboard.salesRevenue"></div>
          <div class="stat-value" id="totalRevenue">-</div>
          <div class="metric-note" id="salesNote"></div>
        </div>
      </section>

      <section class="card section-spacing">
        <div class="card-header">
          <h3 data-i18n="dashboard.lowStockTitle"></h3>
          <a class="btn btn-secondary" href="products.html?low_stock=1" data-i18n="common.viewAll"></a>
        </div>

        <div class="card-body">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th data-i18n="col.product"></th>
                  <th data-i18n="col.category"></th>
                  <th data-i18n="col.inStock"></th>
                  <th data-i18n="col.minimum"></th>
                </tr>
              </thead>
              <tbody id="lowStockTable"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="card section-spacing">
        <div class="card-header">
          <h3 data-i18n="dashboard.recentStockOuts"></h3>
          <a class="btn btn-secondary" href="sales-history.html" data-i18n="common.viewAll"></a>
        </div>

        <div class="card-body recent-sales-list">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th data-i18n="col.id"></th>
                  <th data-i18n="col.reason"></th>
                  <th data-i18n="col.total"></th>
                  <th data-i18n="col.status"></th>
                  <th data-i18n="col.date"></th>
                </tr>
              </thead>
              <tbody id="recentSalesTable"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="assets/js/dashboard.js?v=6"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
